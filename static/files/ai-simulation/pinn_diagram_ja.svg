<text x="55" y="275" text-anchor="middle" fill="#5a6075" font-size="12">入力</text>
<text x="275" y="215" text-anchor="middle" fill="#1f2433" font-size="14"><tspan font-style="italic">u</tspan><tspan baseline-shift="sub" font-size="70%">θ</tspan></text>
<text x="275" y="160" text-anchor="middle" fill="#5a6075" font-size="12">出力</text>
<text x="167" y="275" text-anchor="middle" fill="#5a6075" font-size="12">パラメータ θ</text>
<line x1="290" y1="185" x2="343" y2="185" stroke="#2a3f9e" stroke-width="2" marker-end="url(#ar)"/>
<line x1="535" y1="185" x2="563" y2="185" stroke="#2a3f9e" stroke-width="2" marker-end="url(#ar)"/>
<text x="440" y="114" text-anchor="middle" fill="#1f2433">∂<tspan font-style="italic">u</tspan><tspan baseline-shift="sub" font-size="70%">θ</tspan></text>
<line x1="410" y1="120" x2="470" y2="120" stroke="#1f2433" stroke-width="1"/>
<text x="440" y="137" text-anchor="middle" fill="#1f2433"><tspan>∂</tspan><tspan font-style="italic">t</tspan></text>
<text x="440" y="179" text-anchor="middle" fill="#1f2433">∂<tspan font-style="italic">u</tspan><tspan baseline-shift="sub" font-size="70%">θ</tspan></text>
<line x1="410" y1="185" x2="470" y2="185" stroke="#1f2433" stroke-width="1"/>
<text x="440" y="202" text-anchor="middle" fill="#1f2433"><tspan>∂</tspan><tspan font-style="italic">x</tspan></text>
<text x="440" y="244" text-anchor="middle" fill="#1f2433">∂²<tspan font-style="italic">u</tspan><tspan baseline-shift="sub" font-size="70%">θ</tspan></text>
<line x1="410" y1="250" x2="470" y2="250" stroke="#1f2433" stroke-width="1"/>
<text x="440" y="267" text-anchor="middle" fill="#1f2433"><tspan>∂</tspan><tspan font-style="italic">x</tspan>²</text>
<text x="685" y="110" text-anchor="middle" fill="#1f2433" font-size="17"><tspan font-style="italic">L</tspan> = <tspan font-style="italic">L</tspan><tspan baseline-shift="sub" font-size="70%">PDE</tspan> + <tspan font-style="italic">L</tspan><tspan baseline-shift="sub" font-size="70%">BC</tspan> + <tspan font-style="italic">L</tspan><tspan baseline-shift="sub" font-size="70%">IC</tspan></text>
<text x="585" y="155" fill="#2a3f9e" font-size="14"><tspan font-style="italic">L</tspan><tspan baseline-shift="sub" font-size="70%">PDE</tspan></text>
<text x="635" y="155" fill="#1f2433" font-size="13">方程式の残差</text>
<text x="585" y="205" fill="#2a3f9e" font-size="14"><tspan font-style="italic">L</tspan><tspan baseline-shift="sub" font-size="70%">BC</tspan></text>
<text x="635" y="205" fill="#1f2433" font-size="13">境界条件とのずれ</text>
<text x="585" y="255" fill="#2a3f9e" font-size="14"><tspan font-style="italic">L</tspan><tspan baseline-shift="sub" font-size="70%">IC</tspan></text>
<text x="635" y="255" fill="#1f2433" font-size="13">初期条件とのずれ</text>
<path d="M685,287 L685,330 L165,330 L165,289" fill="none" stroke="#6a4fc4" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<text x="425" y="360" text-anchor="middle" fill="#6a4fc4" font-size="14" font-weight="bold">④ L が小さくなるようにパラメータ θ を更新（学習）</text>
</svg>