<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="'Hiragino Sans','Noto Sans JP','Helvetica Neue',Arial,sans-serif" font-size="15">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a3f9e"/></marker></defs>
<rect width="820" height="380" fill="#ffffff"/>
<rect x="15" y="15" width="300" height="270" rx="12" fill="#f5f6fb" stroke="#c5cbe3"/>
<text x="165.0" y="43" text-anchor="middle" font-weight="bold" fill="#2a3f9e" font-size="16">① ニューラルネットワーク</text>
<text x="165.0" y="65" text-anchor="middle" fill="#5a6075" font-size="13">入力 (x, t) から u を予測</text>
<rect x="345" y="15" width="190" height="270" rx="12" fill="#f5f6fb" stroke="#c5cbe3"/>
<text x="440.0" y="43" text-anchor="middle" font-weight="bold" fill="#2a3f9e" font-size="16">② 自動微分</text>
<text x="440.0" y="65" text-anchor="middle" fill="#5a6075" font-size="13">予測した u を微分</text>
