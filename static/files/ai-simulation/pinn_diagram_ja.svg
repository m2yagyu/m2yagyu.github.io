<text x="685.0" y="43" text-anchor="middle" font-weight="bold" fill="#2a3f9e" font-size="16">③ 損失関数</text>
<text x="685.0" y="65" text-anchor="middle" fill="#5a6075" font-size="13">物理法則とのずれを測る</text>
