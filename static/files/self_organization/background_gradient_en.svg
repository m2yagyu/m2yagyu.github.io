<text x="210" y="330" text-anchor="middle" font-size="16" font-family="'Times New Roman',serif" font-style="italic">∂T<tspan font-size="11" baseline-shift="sub" font-style="normal">0e</tspan>/∂x = −T<tspan font-size="11" baseline-shift="sub" font-style="normal">0e</tspan>/L<tspan font-size="11" baseline-shift="sub" font-style="normal">T0e</tspan> &lt; 0</text>
<text x="575" y="28" text-anchor="middle" font-size="17" font-weight="bold" font-family="'Hiragino Sans','Noto Sans JP','Helvetica Neue',Arial,sans-serif" fill="#222">(b) Simulation plane (x–y plane)</text>
<rect x="475" y="80" width="200" height="200" fill="url(#tg)" stroke="#555" opacity="0.85"/>
