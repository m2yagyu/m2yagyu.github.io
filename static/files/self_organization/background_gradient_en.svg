<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a3f9e"/></marker>
<linearGradient id="tg" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#d7301f"/><stop offset="0.5" stop-color="#fdd9b5"/><stop offset="1" stop-color="#3a78c2"/></linearGradient>
</defs>
<rect width="760" height="350" fill="#fff"/>
<text x="200" y="28" text-anchor="middle" font-size="17" font-weight="bold" font-family="'Hiragino Sans','Noto Sans JP','Helvetica Neue',Arial,sans-serif" fill="#222">(a) Background electron temperature</text>
<line x1="60" y1="290" x2="360" y2="290" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
